<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India – Watch TV Shows Online, Watch Movies Online</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="first">
        <div class="layer">
            <nav>
                <div class="logo">
                    <img src="/Assets/Icons/logo.svg" alt="Netflix-Logo">
                </div>
                <div class="nav2">
                    <div class="select first-select">
                        <div class="lang-logo">
                            <img src="/Assets/Icons/lang-logo.svg">
                        </div>
                        <select>
                            <option>English</option>
                            <option>हिन्दी</option>
                        </select>
                    </div>
                    <button class="signinbutton">Sign In</button>
                </div>
            </nav>

            <div class="main-hero">
                <div class="hero">
                    <div class="hero1">
                        <h1>Enjoy big movies, hit series and more from ₹ 149.</h1>
                        <p>Join today. Cancel anytime.</p>
                    </div>
                    <div class="hero2">
                        <h3>Ready to watch? Enter your email to create or restart your membership.</h3>
                        <div class="form">
                            <div class="input">
                                <label>Email address</label>
                                <input type="text">
                            </div>
                            <button class="getstartedbutton">Get Started &gt;</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    
</body>

</html>
